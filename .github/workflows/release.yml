name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH_LOG: ${{ runner.temp }}/npm-publish.log
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          echo "node $(node -v), npm $(npm -v)"
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi

      # Authenticates through npm trusted publishing (GitHub OIDC), not a token:
      # the package must list this repository and this workflow file on npm, and
      # the job needs the id-token: write permission above.
      - name: Publish to npm
        id: publish
        shell: bash
        run: |
          set -o pipefail
          npm publish --access public 2>&1 | tee "$PUBLISH_LOG"

      - name: Report the publish output on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### npm publish output"
            echo '```'
            if [ -f "$PUBLISH_LOG" ]; then tail -n 80 "$PUBLISH_LOG"; else echo "no publish log"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add the version to the market index
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          node scripts/update-market.mjs "$GITHUB_REF_NAME"

      - name: Commit the market index
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- market.json; then
            echo "market.json already lists ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -m "chore(market): add ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
